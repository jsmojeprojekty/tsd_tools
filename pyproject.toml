[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsdfwd-tools"
version = "0.1.0"
description = "Narzedzia TSD/FWD dla Zakladu Diagnostyki Nawierzchni IBDiM (N1-N4)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "xlrd>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
mdb = ["pyodbc>=5.0"]
net = ["requests>=2.31"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
tsdfwd = "tsdfwd_tools.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsdfwd_tools = ["data/*.csv", "data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "reference: wymaga danych poza repozytorium (sciezki w tests/local_paths.yaml), pomijany gdy brak",
]
